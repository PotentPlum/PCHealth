# Build and test on every push and PR (docs/decisions.md D-009).
# The Windows job is the authority for Windows-specific code; the Linux job mirrors
# the dev container and Claude Code cloud sessions (portable projects only).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows:
    name: Windows (full solution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for solution
        id: guard
        shell: bash
        run: |
          if [ -f PCHealth.slnx ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PCHealth.slnx does not exist yet - nothing to build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.guard.outputs.present == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.guard.outputs.present == 'true'
        run: dotnet restore PCHealth.slnx

      - name: Build
        if: steps.guard.outputs.present == 'true'
        run: dotnet build PCHealth.slnx -c Release --no-restore

      - name: Test
        if: steps.guard.outputs.present == 'true'
        env:
          # Recycle Bin tests put fixture files in the runner's real Recycle Bin, so they run only here (D-017).
          PCHEALTH_RECYCLE_BIN_TESTS: "1"
        run: dotnet test --solution PCHealth.slnx -c Release --no-build

      # Starts the real app untouched and fails if it opens any connection on its own (T-36).
      - name: Launch the app and watch its network use
        if: steps.guard.outputs.present == 'true'
        shell: pwsh
        run: ./scripts/ci/observe-network.ps1 -Exe src/PCHealth.App/bin/Release/net10.0-windows/PCHealth.App.exe

  linux-portable:
    name: Linux (portable projects)
    # Pinned to match Claude Code cloud sessions (Ubuntu 24.04); ubuntu-latest moves to 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The app's Velopack library must match the vpk tool that packs releases (D-009, D-010).
      - name: Check Velopack versions match
        shell: bash
        run: |
          lib=$(grep -oP 'Include="Velopack" Version="\K[^"]+' Directory.Packages.props || true)
          tool=$(grep -oP 'VPK_VERSION: \K\S+' .github/workflows/release.yml)
          if [ -n "$lib" ] && [ "$lib" != "$tool" ]; then
            echo "::error::Velopack NuGet $lib does not match VPK_VERSION $tool in release.yml."
            exit 1
          fi

      - name: Check for portable solution filter
        id: guard
        shell: bash
        run: |
          if [ -f PCHealth.Portable.slnf ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PCHealth.Portable.slnf does not exist yet - nothing to build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.guard.outputs.present == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.guard.outputs.present == 'true'
        run: dotnet restore PCHealth.Portable.slnf

      - name: Build
        if: steps.guard.outputs.present == 'true'
        run: dotnet build PCHealth.Portable.slnf -c Release --no-restore

      - name: Test
        if: steps.guard.outputs.present == 'true'
        run: dotnet test --solution PCHealth.Portable.slnf -c Release --no-build
