# Publish a release (docs/decisions.md D-009). Two ways to start it:
#   - push a version tag: git tag v0.1.0 && git push origin v0.1.0
#   - Actions > Release > Run workflow on main, with the version. This refuses unless CI passed on that commit and
#     the tag doesn't exist yet, and it creates the tag itself once the build is packaged.
# Produces a Velopack installer + update packages on a GitHub Release.
# The app checks for and installs updates only when the user asks (D-010). The Velopack NuGet version in
# Directory.Packages.props must match VPK_VERSION below; the CI Linux job checks this.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0)"
        required: true

permissions:
  contents: write
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  APP_PROJECT: src/PCHealth.App/PCHealth.App.csproj
  MAIN_EXE: PCHealth.App.exe
  PACK_ID: PCHealth
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check app project exists
        shell: bash
        run: |
          if [ ! -f "$APP_PROJECT" ]; then
            echo "::error::$APP_PROJECT does not exist yet - nothing to release."
            exit 1
          fi

      - name: Derive version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run by hand: only a plain X.Y.Z, only from main, only a new tag, only a commit CI passed on.
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.1.0."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made only from main."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$INPUT_VERSION" > /dev/null; then
            echo "::error::Tag v$INPUT_VERSION already exists."
            exit 1
          fi
          # Both CI jobs must have succeeded on this commit. The jobs are checked rather than the run, whose overall
          # status GitHub can leave "in progress" after its jobs have finished.
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '
            [.check_runs[] | select(.name == "Windows (full solution)" or .name == "Linux (portable projects)")]
            | (map(.name) | unique | length) == 2 and all(.conclusion == "success")')
          if [ "$ci" != "true" ]; then
            echo "::error::CI has not passed on $GITHUB_SHA (both CI jobs must have succeeded)."
            exit 1
          fi
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Never ship a build whose tests fail.
      - name: Test
        run: dotnet test --solution PCHealth.slnx -c Release

      - name: Publish
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Pack and upload with Velopack
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          repo="https://github.com/${{ github.repository }}"
          # Fetch the previous release so vpk can build delta updates.
          vpk download github --repoUrl "$repo" --token "$GH_TOKEN" -o Releases
          vpk pack -u "$PACK_ID" -v "$VERSION" -r win-x64 -p publish -e "$MAIN_EXE" -o Releases
          tag="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A tag pushed with GITHUB_TOKEN starts no other workflow, so this run stays the only release run.
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$tag" "$GITHUB_SHA" -m "PC Health Monitor $VERSION"
            git push origin "refs/tags/$tag"
          fi
          vpk upload github --repoUrl "$repo" --token "$GH_TOKEN" -o Releases \
            --publish --releaseName "PCHealth $VERSION" --tag "$tag"
